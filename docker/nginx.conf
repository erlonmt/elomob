# nginx in front of the application (compose.yaml, service "web").
# Port 8000 is the entrance: it passes every request to the Next.js app and writes the client address in
# X-Forwarded-For, replacing any value the client sent, so the API rate limits count each real client.
# Port 8080 serves the Laravel API through PHP-FPM, for the Next.js proxy and for direct calls (localhost:8002).
# Names are resolved again every 10 s through Docker's DNS, so a recreated container is found at its new address.
# The entrance gives each request an id (X-Request-Id), which the API logs and returns; both access logs show it.

resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;
log_format entrance '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time id=$request_id';
log_format api '$http_x_forwarded_for [$time_local] "$request" $status $body_bytes_sent $request_time id=$http_x_request_id';

server {
    listen 8000;
    access_log /var/log/nginx/access.log entrance;

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log api;

    location / {
        set $api app:9000;
        fastcgi_pass $api;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # The Next.js proxy forwards the client address; this hop is added after it.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }
}
